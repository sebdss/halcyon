name: Build

# Intégration continue : tests, analyse et compilation sur chaque branche et demande de
# fusion. La publication des versions (tags v*) est faite par release.yml.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HALCYON_UPDATE_PUBKEY: ${{ vars.HALCYON_UPDATE_PUBKEY }}

jobs:
  windows:
    name: Windows — tests, clippy, compilation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Tests HUS (serveur local, processus réels, pannes simulées)
        run: cargo test -p halcyon-update --features fault-injection
      - name: Clippy
        # -j 1 : le code généré par Slint demande ~5 Go par compilation.
        run: cargo clippy --workspace --all-targets -j 1
      - name: Compilation release
        run: cargo build --release -p halcyon-app -p halcyon-installer -p halcyon-update

  linux:
    name: Linux — tests, compilation, AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libudev-dev libdbus-1-dev libasound2-dev pkg-config squashfs-tools
      - run: cargo test --workspace -j 2
      - name: Tests HUS (serveur local, processus réels, pannes simulées)
        run: cargo test -p halcyon-update --features fault-injection
      - run: cargo build --release -p halcyon-app -p halcyon-installer -p halcyon-update
      - name: AppImage (contrôle de structure)
        run: |
          sh tools/package_appimage.sh
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ./dist/$V/Halcyon-$V-x86_64.AppImage --appimage-extract usr/bin/halcyon-updater >/dev/null
          ./squashfs-root/usr/bin/halcyon-updater --version
