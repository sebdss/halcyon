[package]
name = "halcyon-minecraft"
description = "Minecraft Java Edition dans Halcyon : versions, installation, Java, lancement, loaders, compte Microsoft, mods, modpacks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
ureq.workspace = true
zip.workspace = true
sha2.workspace = true
dirs.workspace = true
base64.workspace = true
# Mojang publie des empreintes SHA-1 (même famille RustCrypto que sha2).
sha1 = "0.11"

[target.'cfg(windows)'.dependencies]
# Chiffrement du jeton de session par DPAPI (lié au compte Windows).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile.workspace = true
