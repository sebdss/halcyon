[package]
name = "halcyon-installer"
description = "Installateur de Halcyon : installation, mise à jour, réparation, désinstallation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "halcyon_installer"
path = "src/lib.rs"

[[bin]]
name = "halcyon-setup"
path = "src/main.rs"

[dependencies]
halcyon-core.workspace = true
halcyon-i18n.workspace = true
slint.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
dirs.workspace = true
sha2.workspace = true
zip.workspace = true
sysinfo = { version = "0.40", default-features = false, features = ["disk", "system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
halcyon-i18n.workspace = true
slint-build.workspace = true
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
